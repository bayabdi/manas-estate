services:
  - type: web
    name: manas-estate
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: manas-estate-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
      - key: PYTHON_VERSION
        value: 3.12.8

databases:
  - name: manas-estate-db
    databaseName: manas_estate
    user: manas_estate
    plan: basic-1gb
